services:
  mfp-mcp:
    build:
      context: .
      target: base
    image: mfp-mcp:local
    container_name: mfp-mcp
    restart: unless-stopped
    user: "10001:10001"
    env_file:
      - .env
    ports:
      # Published on the LAN so other hosts can reach it. HTTP mode has no
      # built-in authentication — restrict access with a host firewall.
      - "8484:8484"
    volumes:
      - ./state/config:/config
      - ./state/data:/data
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    command:
      - "--http"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8484"
      - "--allowed-host"
      - "labtop:*"
      - "--allowed-host"
      - "labtop.local:*"
      - "serve"
