services:
  mfp-mcp:
    build:
      context: .
      target: base
    image: mfp-mcp:local
    container_name: mfp-mcp
    restart: unless-stopped
    user: "10001:10001"
    env_file:
      - .env
    ports:
      # HTTP mode has no built-in authentication; keep it on loopback and
      # reach it via SSH tunnel or an authenticating reverse proxy.
      - "127.0.0.1:8484:8484"
    volumes:
      - ./state/config:/config
      - ./state/data:/data
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
